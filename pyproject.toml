[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-spatial-intelligence"
version = "0.1.0"
description = "REALITY v0: simulation-first action/state layer for AI in the physical world"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reality = "reality.infra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["reality*"]
