[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-spatial-intelligence"
version = "0.1.0"
description = "REALITY v0: simulation-first action/state layer for AI in the physical world"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reality = "reality.infra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["reality*"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
# Prototype modules from May-2026 are preserved as-is for reference
# (see README "Earlier prototype modules"); they expect undeclared
# heavy dependencies and are excluded from type checking.
exclude = [
    "reality/core/edge_processor.py",
    "reality/infra/telemetry_server.py",
    "reality/infra/transport.py",
]
